[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-notification-rules"
version = "0.1.0"
description = "Rule-driven notifications for Django: events emitted by the code, rules set up in the admin, pluggable channels"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Giuseppe Galli", email = "giuseppe.galli@gmail.com" }]
keywords = ["django", "notifications", "events", "rules", "alerts", "inbox"]
dependencies = [
    "Django>=5.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/pinoatrome/django-notification-rules-lib-project"
Source = "https://github.com/pinoatrome/django-notification-rules-lib-project"
Issues = "https://github.com/pinoatrome/django-notification-rules-lib-project/issues"
Changelog = "https://github.com/pinoatrome/django-notification-rules-lib-project/releases"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.5",
    "PyYAML>=6",
]
drf = [
    "djangorestframework>=3.16",
]
yaml = [
    "PyYAML>=6",
]
dev = [
    "tox>=4",
    "ruff>=0.17",
    "pre-commit>=4",
]

[tool.setuptools.packages.find]
include = ["django_notification_rules*"]

[tool.setuptools.package-data]
django_notification_rules = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "dist", "*.egg-info", ".*", "venv", "htmlcov", "run"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/test_api.py" = ["E402"]  # its imports follow pytest.importorskip("rest_framework")

[tool.ruff.lint.isort]
known-first-party = ["django_notification_rules"]

[tool.coverage.run]
source = ["django_notification_rules"]
branch = true
omit = ["*/migrations/*", "build/*", "*/build/*"]

[tool.coverage.paths]
# the package as installed in each tox env counts as the same source
source = ["django_notification_rules", "*/site-packages/django_notification_rules"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["raise NotImplementedError", "if TYPE_CHECKING:", "@(abc\\.)?abstractmethod"]

[tool.coverage.html]
directory = "htmlcov"
