name: CI

on:
  push:
    branches: [main, "stable/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tox.ini's env_list needs every interpreter: 3.10 and 3.12 (Django 4.2), 3.13 (5.2), 3.14 (6.1)
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.10
            3.12
            3.13
            3.14
      - run: python -m pip install --upgrade pip tox
      - run: tox
